<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bandcamp</title>
    <style>
        @font-face {
            font-family: 'Helvetica Neue CDN';
            src: url("../../assets/helveticaneue.woff2") format('woff2');
            font-weight: 400;
            font-style: normal;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #121415;
            color: #888;
            font-family: -apple-system, "Helvetica Neue CDN", "Helvetica Neue", "Segoe UI", Arial, sans-serif;
            -webkit-app-region: drag;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 40px;
            box-sizing: border-box;
            border-bottom: 1px solid #1e2224;
            user-select: none;
        }

        .spacer {
            flex: 0.25;
            -webkit-app-region: drag;
        }

        .nav-controls, .window-controls {
            display: flex;
            align-items: center;
            height: 100%;
            -webkit-app-region: no-drag;
        }

        .nav-controls {
            padding-left: 8px;
            gap: 4px;
        }
        body.mac .nav-controls { padding-left: 76px; }
        body.mac .window-controls button.control { display: none; }
        body.mac .nav-arrows {
            display: flex; align-items: center; gap: 4px; height: 100%;
            margin-left: 18px; padding-right: 8px; -webkit-app-region: no-drag;
        }

        .urlwrap {
            -webkit-app-region: no-drag;
            position: relative; flex: 4; min-width: 0; margin: 0 0 0 10px;
        }
        .spacer { flex: 1; height: 100%; -webkit-app-region: drag; }
        .url-bar {
            box-sizing: border-box;
            width: 100%; height: 26px; margin: 0;
            background: #1b1e1f; border: 1px solid #2a2e30; border-radius: 13px;
            color: #cfcac2; font-size: 12px; padding: 0 34px 0 12px; outline: none;
            font-family: inherit;
        }
        .url-bar:focus { border-color: #1da0c3; color: #fff; }
        .url-bar::selection { background: #1da0c3; color: #fff; }
        #btn-reload {
            position: absolute; right: 3px; top: 50%; transform: translateY(-50%);
            width: 26px; height: 22px; border-radius: 11px;
        }

        button {
            background: transparent;
            border: none;
            color: #888;
            width: 34px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            transition: all 0.15s ease;
        }

        button:hover {
            background: #24282a;
            color: #fff;
        }

        #btn-home { display: none; }

        .polygon-logo {
            width: 22px;
            height: auto;
            fill: #736b5e;
            transition: fill 0.15s ease;
        }

        #btn-home:hover .polygon-logo {
            fill: #ffffff;
        }

        .window-controls button.control {
            width: 46px;
            height: 40px;
            border-radius: 0;
            color: #888;
        }

        .window-controls button.control:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .window-controls button.close:hover {
            background-color: #e81123 !important;
            color: #ffffff !important;
        }

        body.nohover .window-controls button:hover {
            background-color: transparent !important;
            color: #888 !important;
        }

        .tabs {
            -webkit-app-region: no-drag;
            display: none; align-items: center; gap: 4px; margin-left: 6px;
            max-width: 46%; overflow: hidden;
        }
        .tab {
            display: flex; align-items: center; gap: 6px; max-width: 160px; height: 26px;
            padding: 0 5px 0 10px; background: #1b1e1f; border: 1px solid #2a2e30;
            border-radius: 6px; color: #b7b2a8; font-size: 11px; cursor: pointer; flex-shrink: 1; min-width: 0;
        }
        .tab.active { background: #24282a; color: #fff; border-color: #1da0c3; }
        .tab .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .tab .tx {
            width: 16px; height: 16px; flex-shrink: 0; display: flex; align-items: center;
            justify-content: center; border-radius: 3px; color: #888; font-size: 10px;
        }
        .tab .tx:hover { background: rgba(255,255,255,.14); color: #fff; }
    </style>
</head>
<body>

<!-- icons: Dazzle Line Icons (dazzleui.pro via svgrepo, CC BY 4.0), line style: 24px stroke-2 round -->
<div class="nav-controls">
    <button id="btn-home" title="Homepage">
        <svg viewBox="0 0 168 100" class="polygon-logo" aria-hidden="true">
            <path d="M113.88 98.17H0L53.18 0h113.88z"></path>
        </svg>
    </button>

    <button id="btn-back" title="Back">
        <svg width="14" height="14" viewBox="0 0 16 16"><path d="M10.5 3L5.5 8l5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button id="btn-forward" title="Forward">
        <svg width="14" height="14" viewBox="0 0 16 16"><path d="M5.5 3L10.5 8l-5 5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
        
    <button id="btn-newtab" title="New tab">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 6V18M6 12H18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
</div>

<div id="tabs" class="tabs"></div>

<div class="urlwrap">
    <input id="url-bar" class="url-bar" type="text" spellcheck="false" autocomplete="off"
           placeholder="Search Bandcamp or enter a link" aria-label="Address bar">
    <button id="btn-reload" title="Refresh">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
</div>

<div class="spacer"></div>

<div class="window-controls">
    <button id="btn-downloads" title="Downloads" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 4V15M12 15L7 10M12 15L17 10M5 20H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-gsearch" title="Search all of Bandcamp" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2"/><path d="M20 20L15.5 15.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="btn-feed" title="Your feed" type="button">
        <svg width="15" height="15" viewBox="-3 0 19 19" fill="currentColor"><path d="M.926 12.818a1.403 1.403 0 1 1 0 1.984 1.402 1.402 0 0 1 0-1.984zm10.531 2.357a1.03 1.03 0 0 1-1.029-1.03 8.775 8.775 0 0 0-.694-3.438A8.826 8.826 0 0 0 1.591 5.31a1.03 1.03 0 1 1 0-2.059 10.817 10.817 0 0 1 4.24.857 10.893 10.893 0 0 1 3.463 2.334 10.867 10.867 0 0 1 3.19 7.703 1.027 1.027 0 0 1-1.027 1.029zm-4.538 0a1.03 1.03 0 0 1-1.029-1.03 4.297 4.297 0 0 0-4.299-4.298 1.03 1.03 0 0 1 0-2.059 6.362 6.362 0 0 1 5.857 3.883 6.298 6.298 0 0 1 .5 2.475 1.03 1.03 0 0 1-1.029 1.029z"/></svg>
    </button>
    <button id="btn-collection" title="Your collection" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1"/></svg>
    </button>
    <button id="btn-settings" title="Settings" type="button">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 12C15 13.6569 13.6569 15 12 15C10.3431 15 9 13.6569 9 12C9 10.3431 10.3431 9 12 9C13.6569 9 15 10.3431 15 12Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12.9046 3.06005C12.6988 3 12.4659 3 12 3C11.5341 3 11.3012 3 11.0954 3.06005C10.7942 3.14794 10.5281 3.32808 10.3346 3.57511C10.2024 3.74388 10.1159 3.96016 9.94291 4.39272C9.69419 5.01452 9.00393 5.33471 8.36857 5.123L7.79779 4.93281C7.3929 4.79785 7.19045 4.73036 6.99196 4.7188C6.70039 4.70181 6.4102 4.77032 6.15701 4.9159C5.98465 5.01501 5.83376 5.16591 5.53197 5.4677C5.21122 5.78845 5.05084 5.94882 4.94896 6.13189C4.79927 6.40084 4.73595 6.70934 4.76759 7.01551C4.78912 7.2239 4.87335 7.43449 5.04182 7.85566C5.30565 8.51523 5.05184 9.26878 4.44272 9.63433L4.16521 9.80087C3.74031 10.0558 3.52786 10.1833 3.37354 10.3588C3.23698 10.5141 3.13401 10.696 3.07109 10.893C3 11.1156 3 11.3658 3 11.8663C3 12.4589 3 12.7551 3.09462 13.0088C3.17823 13.2329 3.31422 13.4337 3.49124 13.5946C3.69158 13.7766 3.96395 13.8856 4.50866 14.1035C5.06534 14.3261 5.35196 14.9441 5.16236 15.5129L4.94721 16.1584C4.79819 16.6054 4.72367 16.829 4.7169 17.0486C4.70875 17.3127 4.77049 17.5742 4.89587 17.8067C5.00015 18.0002 5.16678 18.1668 5.5 18.5C5.83323 18.8332 5.99985 18.9998 6.19325 19.1041C6.4258 19.2295 6.68733 19.2913 6.9514 19.2831C7.17102 19.2763 7.39456 19.2018 7.84164 19.0528L8.36862 18.8771C9.00393 18.6654 9.6942 18.9855 9.94291 19.6073C10.1159 20.0398 10.2024 20.2561 10.3346 20.4249C10.5281 20.6719 10.7942 20.8521 11.0954 20.94C11.3012 21 11.5341 21 12 21C12.4659 21 12.6988 21 12.9046 20.94C13.2058 20.8521 13.4719 20.6719 13.6654 20.4249C13.7976 20.2561 13.8841 20.0398 14.0571 19.6073C14.3058 18.9855 14.9961 18.6654 15.6313 18.8773L16.1579 19.0529C16.605 19.2019 16.8286 19.2764 17.0482 19.2832C17.3123 19.2913 17.5738 19.2296 17.8063 19.1042C17.9997 18.9999 18.1664 18.8333 18.4996 18.5001C18.8328 18.1669 18.9994 18.0002 19.1037 17.8068C19.2291 17.5743 19.2908 17.3127 19.2827 17.0487C19.2759 16.8291 19.2014 16.6055 19.0524 16.1584L18.8374 15.5134C18.6477 14.9444 18.9344 14.3262 19.4913 14.1035C20.036 13.8856 20.3084 13.7766 20.5088 13.5946C20.6858 13.4337 20.8218 13.2329 20.9054 13.0088C21 12.7551 21 12.4589 21 11.8663C21 11.3658 21 11.1156 20.9289 10.893C20.866 10.696 20.763 10.5141 20.6265 10.3588C20.4721 10.1833 20.2597 10.0558 19.8348 9.80087L19.5569 9.63416C18.9478 9.26867 18.6939 8.51514 18.9578 7.85558C19.1262 7.43443 19.2105 7.22383 19.232 7.01543C19.2636 6.70926 19.2003 6.40077 19.0506 6.13181C18.9487 5.94875 18.7884 5.78837 18.4676 5.46762C18.1658 5.16584 18.0149 5.01494 17.8426 4.91583C17.5894 4.77024 17.2992 4.70174 17.0076 4.71872C16.8091 4.73029 16.6067 4.79777 16.2018 4.93273L15.6314 5.12287C14.9961 5.33464 14.3058 5.0145 14.0571 4.39272C13.8841 3.96016 13.7976 3.74388 13.6654 3.57511C13.4719 3.32808 13.2058 3.14794 12.9046 3.06005Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button class="control minimize" id="btn-min" title="Minimize" type="button">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 5h8" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="control maximize" id="btn-max" title="Maximize" type="button">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.5" y="1.5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="control close" id="btn-close" title="Close" type="button">
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    </button>
</div>

<script>
    const { ipcRenderer } = require('electron');
    if (typeof process !== 'undefined' && process.platform === 'darwin') {
        document.body.classList.add('mac');
        const arrows = document.createElement('div');
        arrows.className = 'nav-arrows';
        arrows.appendChild(document.getElementById('btn-back'));
        arrows.appendChild(document.getElementById('btn-forward'));
        document.body.appendChild(arrows);
    }

    document.getElementById('btn-back').onclick = () => ipcRenderer.send('app:back');
    document.getElementById('btn-forward').onclick = () => ipcRenderer.send('app:forward');
    document.getElementById('btn-reload').onclick = () => ipcRenderer.send('app:reload');
    document.getElementById('btn-home').onclick = () => ipcRenderer.send('app:home');
    document.getElementById('btn-settings').onclick = () => ipcRenderer.send('app:settings');

    const btnCollection = document.getElementById('btn-collection');
    btnCollection.onclick = () => ipcRenderer.send('collection:toggle');
    ipcRenderer.on('collection:state', (_e, open) => { btnCollection.style.color = open ? '#1da0c3' : ''; });

    const btnFeed = document.getElementById('btn-feed');
    btnFeed.onclick = () => ipcRenderer.send('feed:toggle');
    ipcRenderer.on('feed:state', (_e, open) => { btnFeed.style.color = open ? '#1da0c3' : ''; });

    const btnDownloads = document.getElementById('btn-downloads');
    btnDownloads.onclick = () => ipcRenderer.send('downloads:toggle');
    ipcRenderer.on('downloads:state', (_e, open) => { btnDownloads.style.color = open ? '#1da0c3' : ''; });

    const btnGsearch = document.getElementById('btn-gsearch');
    btnGsearch.onclick = () => ipcRenderer.send('gsearch:toggle');
    ipcRenderer.on('gsearch:state', (_e, open) => { btnGsearch.style.color = open ? '#1da0c3' : ''; });

    // window bar customization (settings): show/hide individual controls
    function applyHeaderButtons(cfg) {
        if (!cfg || typeof cfg !== 'object') return;
        const show = (el, on, disp) => { if (el) el.style.display = on ? (disp || '') : 'none'; };
        show(document.getElementById('btn-home'), cfg.home === true, 'flex');
        show(document.getElementById('btn-back'), cfg.back !== false);
        show(document.getElementById('btn-forward'), cfg.forward !== false);
        show(document.getElementById('btn-newtab'), cfg.newtab !== false);
        show(document.querySelector('.urlwrap'), cfg.urlbar !== false);
        show(document.getElementById('btn-reload'), cfg.reload !== false);
        show(btnDownloads, cfg.downloads !== false);
        show(btnGsearch, cfg.gsearch !== false);
        show(btnCollection, cfg.collection !== false);
        show(btnFeed, cfg.feed !== false);
    }
    ipcRenderer.on('header:buttons', (_e, cfg) => applyHeaderButtons(cfg));
    ipcRenderer.invoke('settings:get').then((s) => applyHeaderButtons(s && s.headerButtons)).catch(() => {});

    document.getElementById('btn-newtab').onclick = () => ipcRenderer.send('tab:new');
    const tabsEl = document.getElementById('tabs');
    ipcRenderer.on('tabs:state', (_e, st) => {
        const tabs = (st && st.tabs) || [];
        tabsEl.innerHTML = '';
        if (tabs.length <= 1) { tabsEl.style.display = 'none'; return; }
        tabsEl.style.display = 'flex';
        for (const t of tabs) {
            const el = document.createElement('div');
            el.className = 'tab' + (t.active ? ' active' : '');
            el.title = t.title || 'Bandcamp';
            const tt = document.createElement('span'); tt.className = 'tt'; tt.textContent = t.title || 'Bandcamp';
            const tx = document.createElement('span'); tx.className = 'tx'; tx.innerHTML = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
            el.appendChild(tt); el.appendChild(tx);
            el.addEventListener('click', (e) => { if (e.target !== tx) ipcRenderer.send('tab:activate', t.id); });
            el.addEventListener('mouseup', (e) => { if (e.button === 1) { e.preventDefault(); ipcRenderer.send('tab:close', t.id); } });
            tx.addEventListener('click', (e) => { e.stopPropagation(); ipcRenderer.send('tab:close', t.id); });
            tabsEl.appendChild(el);
        }
    });

    document.getElementById('btn-min').onclick = () => {
        ipcRenderer.send('window:minimize');
        document.body.classList.add('nohover');
    };
    window.addEventListener('mousemove', () => document.body.classList.remove('nohover'));
    document.getElementById('btn-max').onclick = () => ipcRenderer.send('window:maximize');
    document.getElementById('btn-close').onclick = () => ipcRenderer.send('window:close');

    // address bar: shows the current page url & navigates on enter
    const urlBar = document.getElementById('url-bar');
    let urlFocused = false;
    urlBar.addEventListener('focus', () => { urlFocused = true; urlBar.select(); });
    urlBar.addEventListener('blur', () => { urlFocused = false; });
    urlBar.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { ipcRenderer.send('app:navigate-url', urlBar.value); urlBar.blur(); }
        else if (e.key === 'Escape') { urlBar.blur(); }
    });
    ipcRenderer.on('nav:url', (_e, url) => { if (!urlFocused) urlBar.value = url || ''; });

    // media hotkeys while the header is focused, forwarded to the player
    function mediaHotkeyOf(e) {
        const t = e.target, tag = t ? t.tagName : '';
        if (t && (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || t.isContentEditable)) return '';
        const space = e.key === ' ' || e.code === 'Space';
        if (space && tag === 'BUTTON') return '';
        if (space) return 'toggle';
        if (e.key === 'ArrowLeft') return e.shiftKey ? 'prev' : 'seek-back';
        if (e.key === 'ArrowRight') return e.shiftKey ? 'next' : 'seek-fwd';
        if (e.key === 'ArrowUp' && e.shiftKey) return 'vol-up';
        if (e.key === 'ArrowDown' && e.shiftKey) return 'vol-down';
        if (!e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey && e.key >= '0' && e.key <= '9') return 'seek-pct-' + e.key;
        return '';
    }
    document.addEventListener('keydown', (e) => {
        const cmd = mediaHotkeyOf(e);
        if (!cmd) return;
        e.preventDefault();
        if (e.repeat && (cmd === 'toggle' || cmd === 'prev' || cmd === 'next')) return;
        ipcRenderer.send('player:hotkey', cmd);
    });
</script>
</body>
</html>
